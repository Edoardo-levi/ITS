<!--Quale sarà il risultato di a e x dopo l’esecuzione
del codice sotto?
let a = 2;
let x = 1 + (a *= 2);-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   
    <title>Esercizio 3.6</title>
</head>
<body>
    <div id="risultato"></div>
    <script>
       
    let a = 2;
    let x = 1 + (a *= 2);
    document.getElementById("risultato").innerHTML="la scrittura let x = 1 + (a *= 2), somma 1 al quadrato di a (" + a +")" + x
    </script>
    
</body>
</html>
