<!DOCTYPE html>
<html >
<head>
    
    <title>La mia spesa semplice</title>
    <link rel="stylesheet" href="stile.css">

    <script>
        function aggiungi_prodotto(){
            var prodotto= document.getElementById("prodotto").value.trim();
            if (prodotto == "") {
                alert("Inserisci un prodotto");

                return false;
            }

            // recupero elemento ui 

            var lista = document.getElementById("result");

           
            // creo un nuovo elemento di tipo li
            var nomvoElemnto= document.createElement("li");
            // sto riempendo li
            nomvoElemnto.textContent=prodotto;
            //aggiongo l'elemento alla lista 
            lista.appendChild(nomvoElemnto);
        }
        function reset(){
            var lista= document.getElementById("result");
            lista.remove();
        }
    </script>
</head>
<body align="center">
    <img src="immagini/pausa.png">
    <h1 align="center" style="color: red;"> LISTA DELLA SPESA</h1>
    Prodotto <input class="input-stile" type="text" id="prodotto" placeholder="Inserisci Prodotto">  
    <br> <br>

    <button onclick="aggiungi_prodotto()" class="bottone-aggiungi">Aggiungi al carrello</button>
    <br><br>
    <h2 align="center">Carrello della spesa</h2>
    <ui id="result">
    </ui>
    <br>
    <br></br>
    <button onclick="reset()" class="bottone-reset">Ripristina lista</button>
</body>
</html>
