<!--Scrivere un pagina che tramite una funzione
javascript realizza queste linee tenendo presente
che hanno una lunghezza che parte da 0% fino al
100% con passo 5. (utilizzare il tag html <hr> per
fare le righe) ed utilizzare il dom per modificare
lo stile.-->

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio 5.4</title>
  <style>
    hr {
      margin: 5px auto;
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    function creaLineePiramidali() {
      const container = document.getElementById('container');
      container.innerHTML = '';

      
      for (let larghezza = 0; larghezza <= 100; larghezza += 5) {
        const linea = document.createElement('hr');
        linea.style.width = larghezza + '%';
        container.appendChild(linea);
      }
    }

    window.onload = creaLineePiramidali;
  </script>
</body>
</html>
