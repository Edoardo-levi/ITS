<!--Scrivere un pagina che tramite una funzione
javascript realizza queste linee tenendo presente
che hanno una lunghezza che parte da 0% fino al
100% con passo 5. (utilizzare il tag html <hr> per
fare le righe) ed utilizzare il dom per modificare
lo stile.-->

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio 5.4</title>
  
<body>
  
<!--<hr style="width: 15%;"> -->
<div id="contenitore"></div>
<script>

  for (let x=0; x<=100; x+=5) {

    let miohr = document.createElement("hr");
    miohr.setAttribute("style", `width : ${x}%`);
    document.getElementById("contenitore").appendChild(miohr)
  }
</script>
</head>
</body>
</html>
