<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio1</title>
    <style>
        input[type="text"], select, textarea {
            width: 300px;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }        
    </style>
    <script>
        function campi_errati(event) {
            var cognome = document.getElementById("cognome").value.trim();
            if (cognome === "") {
                alert("Il campo Cognome non può essere vuoto");
                event.preventDefault();
                return false;
            }

            var nome = document.getElementById("nome").value.trim();
            if (nome == ""){
                alert("Il campo nome non può essere vuoto");
                event.preventDefault();
                return false;
            }

            let matricola = document.getElementById("matricola").value.trim();
            if (isNaN(matricola.trim())){
                alert("La matricola deve essere un numero");
                event.preventDefault();
                return false;
            }

            let regione = document.getElementById("regione").value;
            if (regione == "select"){
                alert("Seleziona una regione");
                event.preventDefault();
                return false;
            }

            var email = document.getElementById("email").value.trim();
            var telefono = document.getElementById("telefono").value.trim();

            if (email === "" || telefono === "") {
                alert("L'email o il telefono non possono essere vuoti");
                event.preventDefault();
                return false;
            }

            return true;
        }
    </script>
</head>
<body>

<form onsubmit="return campi_errati(event)">
    <table>
    
        <tr>
            <td>Nome</td>
            <td>
                <input type="text" id="nome" name="nome" placeholder="Inserisci il nome">
            </td>
        </tr>
        <tr>
            <td>Cognome</td>
            <td>
                <input type="text" id="cognome" name="cognome" placeholder="Inserisci il cognome">
            </td>
        </tr>
        <tr>
            <td>Numero Matricola</td>
            <td>
                <input type="text" id="matricola" name="matricola" placeholder="Inserisci il numero di matricola">
            </td>
        </tr>
        <tr>
            <td>Regione di residenza</td>
            <td>
                <select id="regione" name="regione">
                    <option value="select">--Seleziona Regione</option>
                    <option value="Abruzzo">Abruzzo</option>
                    <option value="Basilicata">Basilicata</option>
                    <option value="Calabria">Calabria</option>
                    <option value="Campania">Campania</option>
                    <option value="Emilia-Romagna">Emilia-Romagna</option>
                    <option value="Friuli Venezia Giulia">Friuli Venezia Giulia</option>
                    <option value="Lazio">Lazio</option>
                    <option value="Liguria">Liguria</option>
                    <option value="Lombardia">Lombardia</option>
                    <option value="Marche">Marche</option>
                    <option value="Molise">Molise</option>
                    <option value="Piemonte">Piemonte</option>
                    <option value="Puglia">Puglia</option>
                    <option value="Sardegna">Sardegna</option>
                    <option value="Sicilia">Sicilia</option>
                    <option value="Toscana">Toscana</option>
                    <option value="Trentino-Alto Adige/Südtirol">Trentino-Alto Adige/Südtirol</option>
                    <option value="Umbria">Umbria</option>
                    <option value="Valle d'Aosta">Valle d'Aosta</option>
                    <option value="Veneto">Veneto</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>E-mail</td>
            <td>
                <input type="text" id="email" name="email" placeholder="Inserisci la tua email">
            </td>
        </tr>
        <tr>
            <td>Numero di Telefono</td>
            <td>
                <input type="text" id="telefono" name="telefono" placeholder="Telefono">
            </td>
        </tr>
        <tr>
            <td>Richieste Particolari</td>
            <td>
                <textarea name="richieste" rows="12" cols="60" placeholder="Inserisci testo..."></textarea>
            </td>
        </tr>
        <tr>
            <td><input type="reset"   value="Reset Form"  style="width: 150px; padding: 10px; background-color: #4CAF50; color: white; border: none; cursor: pointer; margin-top: 10px;"></td>
        </tr>
        <tr>
            <td><input type="submit" value="Invio" style="width: 150px; padding: 10px; background-color: #4CAF50; color: white; border: none; cursor: pointer; margin-top: 10px;"></td>
        </tr>
    </table>

</body>
</html>
